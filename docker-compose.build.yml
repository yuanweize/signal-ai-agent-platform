services:
  backend:
    image: signal-market-bot-backend:${APP_VERSION:-dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}

  frontend:
    image: signal-market-bot-frontend:${APP_VERSION:-dev}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
