services:
  # ============================================================
  # Backend — FastAPI + Signal Bot Engine
  # ============================================================
  backend:
    image: ghcr.io/yuanweize/signal-market-bot-backend:${APP_VERSION:-latest}
    container_name: smb-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/bot.db
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost:3000
      - AI_VECTOR_STORE_BACKEND=${AI_VECTOR_STORE_BACKEND:-in_memory}
      - QDRANT_URL=http://qdrant:6333
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - smb-network

  # ============================================================
  # Qdrant — Vector Search Engine Sidecar (Optional / Production RAG)
  # ============================================================
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: smb-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smb-network

  # ============================================================
  # Frontend — React Admin Dashboard (Nginx)
  # ============================================================
  frontend:
    image: ghcr.io/yuanweize/signal-market-bot-frontend:${APP_VERSION:-latest}
    container_name: smb-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smb-network

volumes:
  qdrant_data:
    name: smb-qdrant-data

networks:
  smb-network:
    driver: bridge
    name: smb-network
