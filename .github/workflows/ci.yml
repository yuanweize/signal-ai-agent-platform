name: CI

on:
  push:
    branches: ["main", "refactor/**", "feat/**", "fix/**"]
  pull_request:

jobs:
  # ============================================================
  # Backend — lint, format, type-check, compile, pytest, migrations, evals
  # ============================================================
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app/ tests/ evals/

      - name: Ruff format check
        run: ruff format --check app/ tests/ evals/

      - name: Compile check
        run: python -m compileall app/

      - name: Run unit & integration tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      - name: Run Golden Dataset AI Evaluation Benchmarks
        run: python evals/run_evals.py

      - name: Alembic migration tests (fresh & legacy 112aa6e)
        run: pytest tests/test_migrations.py -v
        env:
          DATABASE_URL: "sqlite+aiosqlite:////tmp/ci_test.db"

      - name: CLI migration check against fresh DB
        run: |
          DATABASE_URL="sqlite+aiosqlite:////tmp/ci_fresh.db" alembic upgrade head
          DATABASE_URL="sqlite+aiosqlite:////tmp/ci_fresh.db" alembic current

  # ============================================================
  # Frontend — install, lint, typecheck, unit tests, build
  # ============================================================
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint check
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit & Component tests (Vitest)
        run: npm test

      - name: Production Build
        run: npm run build

  # ============================================================
  # Docker — compose config and real ephemeral runtime smoke
  # ============================================================
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Create local data directory
        run: mkdir -p data

      - name: Ephemeral Docker Compose Up & Build
        run: docker compose up -d --build

      - name: Probe Qdrant readiness
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:6333/healthz | grep -q "ok"; then
              echo "Qdrant is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant readiness probe timed out"
          exit 1

      - name: Probe Backend readiness (/health/ready)
        run: |
          for i in {1..40}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health/ready || true)
            if [ "$status" = "200" ]; then
              echo "Backend is ready (HTTP 200)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend readiness probe timed out"
          exit 1

      - name: Probe Backend liveness (/health/live)
        run: |
          live_status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health/live)
          if [ "$live_status" != "200" ]; then
            echo "Backend liveness probe failed: HTTP $live_status"
            exit 1
          fi
          echo "Backend liveness passed (HTTP 200)"

      - name: Probe Frontend HTTP
        run: |
          for i in {1..20}; do
            fe_status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ || true)
            if [ "$fe_status" = "200" ]; then
              echo "Frontend is serving (HTTP 200)"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend probe failed"
          exit 1

      - name: Dump Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Cleanup ephemeral containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
