name: CI

on:
  push:
    branches: ["main", "refactor/**"]
  pull_request:

jobs:
  # ============================================================
  # Backend — lint, type-check, compile, pytest
  # ============================================================
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

      - name: Compile check
        run: python -m compileall app/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      - name: Alembic migration check (fresh DB)
        run: |
          # Verify migrations run cleanly against a fresh empty DB
          DATABASE_URL="sqlite+aiosqlite:////tmp/ci_test.db" alembic upgrade head
          DATABASE_URL="sqlite+aiosqlite:////tmp/ci_test.db" alembic current

  # ============================================================
  # Frontend — install, lint, typecheck, build
  # ============================================================
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
